name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff warnings
        run: ruff check . --select I001,D,PTH,UP015,UP017,B905 --exit-zero
      - name: Ruff
        run: ruff check . --ignore I001,D,PTH,UP015,UP017,B905
      - name: Type check
        run: basedpyright
