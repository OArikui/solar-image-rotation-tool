[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-image-rotation-tool"
version = "0.1.0"
description = "GUI tool for aligning two solar images and measuring their relative rotation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fuji Astronomy Club Coders" }]
dependencies = [
    "astropy>=6.1",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "matplotlib>=3.9",
    "opencv-python-headless>=4.10",
    "PyQt6>=6.7",
    "tifffile>=2024.8.10",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.31",
    "ruff>=0.13",
]

[project.scripts]
solar-image-rotation-tool = "solar_rotation_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solar_rotation_tool = ["vendor/min2_config.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".github", ".venv", "venv", "build", "dist", "src/solar_rotation_tool/vendor/MIN2ver2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "A", "D", "ANN"]
ignore = ["E501", "D107", "D400", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.basedpyright]
extraPaths = ["src"]
exclude = ["src/solar_rotation_tool/vendor/MIN2ver2.py"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
reportMissingImports = "error"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
